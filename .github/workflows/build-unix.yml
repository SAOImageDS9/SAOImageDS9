name: build-unix
run-name: Build UNIX

on:
  push:
    branches:
    - master
    tags:
    - '*'
  pull_request:

#Reduces GH Action duplication:
# Cancels the previous pipeline for this ref it is still running
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-builds:
    defaults:
      run:
        shell: bash

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Ubuntu Latest
            os: ubuntu-latest
          - name: macOS Latest ARM
            os: macos-latest
          - name: macOS 15 Intel
            os: macos-15-intel

    steps:
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # 6.0.2

    - name: Install dependencies
      env:
        DS9_BUILD_OS: ${{ matrix.os }}
      run: |
        source .github/scripts/setup.sh

    - name: Configure
      env:
        DS9_BUILD_OS: ${{ matrix.os }}
      run: |
        if [ "${RUNNER_OS}" == "macOS" ]; then
          export PKG_CONFIG_PATH=/opt/X11/lib/pkgconfig:/opt/X11/share/pkgconfig/
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export CFLAGS="-mmacosx-version-min=12.0"
          export CXXFLAGS="-mmacosx-version-min=12.0"
          export LDFLAGS="-mmacosx-version-min=12.0"
        fi
        unix/configure --with-arch=${DS9_BUILD_OS}

    - name: Build
      run: |
        if [ "${RUNNER_OS}" == "macOS" ]; then
          export PKG_CONFIG_PATH=/opt/X11/lib/pkgconfig:/opt/X11/share/pkgconfig/
          export MACOSX_DEPLOYMENT_TARGET=12.0
          export CFLAGS="-mmacosx-version-min=12.0"
          export CXXFLAGS="-mmacosx-version-min=12.0"
          export LDFLAGS="-mmacosx-version-min=12.0"
        fi
        make && make dist

    - name: Check executable
      run: |
        ./bin/ds9 -help

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.os }}
        path: |
            dist/ds9.${{ matrix.os }}.*.tar.gz
            dist/xpa.${{ matrix.os }}.*.tar.gz
        retention-days: 2

  macos-universal:
    defaults:
      run:
        shell: bash

    name: macOS Universal
    needs: check-builds
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # 6.0.2

    - name: Download arm64 tarballs
      uses: actions/download-artifact@v8
      with:
        name: binary-macos-latest
        path: inputs/arm64

    - name: Download x86_64 tarballs
      uses: actions/download-artifact@v8
      with:
        name: binary-macos-15-intel
        path: inputs/x86_64

    - name: Make universal tarballs
      run: |
        .github/scripts/make-universal-tar.sh inputs/arm64 inputs/x86_64 dist

    - name: Upload universal tarballs
      uses: actions/upload-artifact@v7
      with:
        name: binary-macos-universal
        path: |
            dist/ds9.macos-universal.*.tar.gz
            dist/xpa.macos-universal.*.tar.gz
        retention-days: 2
